name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BookWinFormUI.sln

      - name: Build solution (Debug)
        run: msbuild BookWinFormUI.sln /p:Configuration=Debug /p:Platform="Any CPU" /v:minimal

      - name: Build solution (Release)
        run: msbuild BookWinFormUI.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
